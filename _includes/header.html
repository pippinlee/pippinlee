<header class="site-header">
	<div class="branding">
		{% if site.thetheme.gravatar %}
		<a href="{{ '/' | relative_url }}">
			<img class="avatar" src="https://secure.gravatar.com/avatar/{{ site.thetheme.gravatar }}?s=100" alt=""/>
		</a>
		{% elsif site.thetheme.avatar %}
		<a href="{{ '/' | relative_url }}">
			<img class="avatar" src="{{ site.thetheme.avatar | prepend: '/img/' | relative_url }}" alt=""/>
		</a>
		{% endif %}
		<h1 class="site-title">
			<a href="{{ '/' | relative_url }}">{{ site.thetheme.title }}</a>
		</h1>
	</div>
	<button class="menu-toggle" type="button" aria-controls="site-navigation" aria-expanded="false" aria-label="Toggle navigation menu">MENU</button>
	<nav class="site-nav" id="site-navigation" aria-label="Main navigation">
		<ul>


			<li>
				<a class="page-link" href="{{ '/about' | relative_url }}">
					About
				</a>
			</li>

			<li>
				<a class="page-link" href="{{ '/work/' | relative_url }}">
					Work
				</a>
			</li>

			<li>
				<a class="page-link" href="{{ '/photos/' | relative_url }}">
					Photos
				</a>
			</li>
			<!-- Social icons from Font Awesome, if enabled -->

		</ul>
	</nav>
</header>
