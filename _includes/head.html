<head>
	<meta charset="utf-8">
	{% include metadata.html %}
	<meta name="viewport" content="width=device-width, initial-scale=1">


	<!-- CSS -->
	<link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}?v={{ site.time | date: '%s' }}">

	<!--Favicon-->
	<link rel="shortcut icon" href="{{ "/favicon.ico" | relative_url }}" type="image/x-icon">

	<!-- Canonical -->
	<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

	<!-- RSS -->
	<link rel="alternate" type="application/rss+xml" title="{{ site.thetheme.title }}" href="{{ "/feed.xml" | absolute_url }}" />

	<!-- Font Awesome -->
	<link href="//maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">

	<!-- Google Fonts -->
	{% if site.thetheme.google_fonts %}
	<link href="//fonts.googleapis.com/css?family={{ site.thetheme.google_fonts }}" rel="stylesheet" type="text/css">
  	<link href='//fonts.googleapis.com/css?family=Gentium+Book+Basic:400italic' rel='stylesheet' type='text/css'>
  	<link href='//fonts.googleapis.com/css?family=PT+Sans:400,400italic' rel='stylesheet' type='text/css'>
  	<link href="https://fonts.googleapis.com/css?family=Raleway" rel="stylesheet">
  	<link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
	{% endif %}

  <script type="text/javascript" src="{{ "/js/mobile-view.js" | relative_url  }}"></script>


	<!-- KaTeX -->
	{% if site.thetheme.katex %}
	<link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/KaTeX/0.3.0/katex.min.css">
	<script src="//cdnjs.cloudflare.com/ajax/libs/KaTeX/0.3.0/katex.min.js"></script>
	{% endif %}

	<!-- Google Analytics -->
	{% if site.thetheme.google_analytics %}
	<script>
	(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
	(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
	m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
	})(window,document,'script','//www.google-analytics.com/analytics.js','ga');

	ga('create', '{{ site.thetheme.google_analytics }}', 'auto');
	ga('send', 'pageview');
	</script>
	{% endif %}
</head>
